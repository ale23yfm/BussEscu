server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # API routes /v1/... mapped internally to folder /backend
    location /v1/ {
        try_files $uri /backend$uri /backend$uri/ /backend$uri/index.php?$query_string =404;
    }

    # Standard routing: try the file request, otherwise send it to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP file processing through FastCGI to backend container
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}