<!doctype html>
<html lang="ro" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bussescu-App</title>
    <link rel="icon" href="./assets/Favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dist/main.css" />
  </head>
  <body>
    <header>
      <img src="./assets/BussEscu.png" alt="Bussescu" />
    </header>

    <main>
      <div class="heading">
        <h1 class="heading__title">Alege BussEscu cu încredere</h1>
        <button type="button" class="theme-toggle"></button>
      </div>

      <div class="form-wrapper">
        <div class="dropdown-wrapper">
          <div class="dropdown-wrapper__input">
            <input
              type="text"
              name="start-station"
              id="start-station"
              class="search-input"
              placeholder="Punct plecare"
              autocomplete="off"
            />
            <span class="point-icon">
              <img src="./assets/icons/Start.svg" alt="Starting point" />
            </span>
          </div>

          <ul id="suggestions-list" class="dropdown-wrapper__list hidden"></ul>
        </div>
        <div class="dropdown-wrapper">
          <div class="dropdown-wrapper__input">
            <input
              type="text"
              name="start-station"
              id="start-station"
              class="search-input"
              placeholder="Punct sosire"
              autocomplete="off"
            />
            <span class="point-icon">
              <img src="./assets/icons/Stop.svg" alt="Destination point" />
            </span>
          </div>

          <ul id="suggestions-list" class="dropdown-wrapper__list hidden"></ul>
        </div>

        <button type="submit" class="search-btn">
          Caută

          <span class="search-icon"></span>
        </button>
      </div>

      <div class="results">
        <div class="results__heading hidden">
          <span class="results__icon"></span>
          <h2 class="results__title">Linii valide</h2>
        </div>

        <div class="results__wrapper">
          <!-- Visible loader component -->
          <!-- <span class="loader loader--center"></span> -->
        </div>
      </div>

      <div class="lines">
        <div class="dropdown-wrapper">
          <div class="dropdown-wrapper__input">
            <input
              type="text"
              name="lines-input"
              id="lines-input"
              class="search-input"
              placeholder="Alege linia..."
              autocomplete="off"
            />
            <span class="roadmap-icon">
              <i class="ri-route-line"></i>
            </span>
          </div>

          <ul
            id="line-suggestions-list"
            class="dropdown-wrapper__list hidden"
          ></ul>
        </div>

        <div class="lines-wrapper hidden">
          <div class="lines-wrapper__body">
            <div class="retur-wrapper"></div>
            <div class="separator">
              <div class="circuit-terminal circuit-terminal--top">
                <span>Tur</span>
                <i class="ri-arrow-right-s-fill circuit-terminal__icon"></i>
              </div>
              <div class="circuit-terminal circuit-terminal--bottom">
                <span>Retur</span>
                <i class="ri-arrow-left-s-fill circuit-terminal__icon"></i>
              </div>
            </div>
            <div class="tur-wrapper"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="environment/config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
