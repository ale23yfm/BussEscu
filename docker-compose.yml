version: "3.8"

services:
  # 1. Backend service (PHP-FPM)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bussescu_backend
    volumes:
      - .:/var/www/html
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=bus_tracker
    depends_on:
      - mongodb

  # 2. Nginx service
  nginx:
    image: nginx:alpine
    container_name: bussescu_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  # 3. MongoDB service
  mongodb:
    image: mongo:7.0
    container_name: bussescu_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
